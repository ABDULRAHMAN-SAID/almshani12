# نشر على Fly.io:  fly launch --copy-config --yes  ثم  fly volumes create data --size 1  ثم  fly deploy
app = "manassah"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  DATA_DIR = "/data"
  TRUST_PROXY = "true"
  ALLOW_DEMO_SEED = "1"
  OTP_FIXED_CODE = "000000"
  PAYMENT_PROVIDERS = "mock,wallet,manual"
  ROOM_PROVIDER = "internal"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[[mounts]]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
