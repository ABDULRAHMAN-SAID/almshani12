# نشر على Fly.io:  fly launch --copy-config --yes  ثم  fly volumes create data --size 1  ثم  fly deploy
# سنغافورة — أقرب منطقة فلاي فعلياً لعُمان من فرانكفورت
app = "manassah"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  DATA_DIR = "/data"
  TRUST_PROXY = "true"
  ALLOW_DEMO_SEED = "0"  # إنتاج حقيقي: بلا حسابات أو حجوزات تجريبية — المنهج فقط + مديرك من ADMIN_PHONE
  # تحذير: OTP_FIXED_CODE = "000000" يفتح كل حساب لمن يعرف الرقم — لا تفعّله على خادم يحمل بيانات حقيقية.
  # الخادم يتجاهله أصلاً في الإنتاج؛ فعّله فقط لخادم عرض مؤقّت مع ALLOW_INSECURE_OTP=1.
  # OTP_FIXED_CODE = "000000"
  PAYMENT_PROVIDERS = "mock,wallet,manual"
  ROOM_PROVIDER = "internal"
  SMS_ALLOWED_COUNTRIES = "+968"
  # بريد Gmail: المضيف والمنفذ ثابتان ومعروفان (لا حاجة أن يكونا سرّاً) — السرّان الفعليان
  # هما SMTP_USER وSMTP_PASS فقط، يُضبطان كأسرار GitHub وتُمرَّر عند النشر
  SMTP_HOST = "smtp.gmail.com"
  SMTP_PORT = "587"
  # رموز تحقّق حقيقية (اختيارية): الأسرار تُضبط بـ fly secrets set لا هنا — راجع README «رموز تحقّق حقيقية»
  #   fly secrets set SMTP_HOST=smtp.gmail.com SMTP_PORT=587 SMTP_USER=... SMTP_PASS=... EMAIL_FROM=...
  #   fly secrets set RESEND_API_KEY=...
  #   fly secrets set TWILIO_ACCOUNT_SID=... TWILIO_AUTH_TOKEN=... TWILIO_VERIFY_SERVICE_SID=...
  #   fly secrets set TWILIO_FROM=... TWILIO_MESSAGING_SERVICE_SID=... TWILIO_WHATSAPP_FROM=...
  #   fly secrets set SMS_HTTP_URL=... SMS_HTTP_METHOD=POST SMS_HTTP_HEADERS='{...}' SMS_HTTP_BODY='{...}' SMS_HTTP_OK=...
  #   fly secrets set OTP_TEST_TARGETS=+96899000000 OTP_FIXED_CODE=none
  # الدفع — README «ثواني»: PAYMENT_PROVIDERS=thawani,wallet,manual ثم
  #   fly secrets set THAWANI_SECRET_KEY=... THAWANI_PUBLISHABLE_KEY=... THAWANI_WEBHOOK_SECRET=...
  #   fly secrets set STRIPE_SECRET_KEY=sk_live_... STRIPE_WEBHOOK_SECRET=whsec_...
  # الدخول الاجتماعي (معرّفات العملاء؛ فارغ = مخفي): fly secrets set GOOGLE_CLIENT_IDS=... APPLE_CLIENT_IDS=... APPLE_SERVICES_ID=...
  # الغرف: fly secrets set LIVEKIT_URL=wss://... LIVEKIT_API_KEY=... LIVEKIT_API_SECRET=...
  #   TURN ثابت: TURN_URL=... TURN_USERNAME=... TURN_CREDENTIAL=...  أو ديناميكي: METERED_API_KEY=... METERED_DOMAIN=... (أو مفاتيح Twilio)
  # الإشعارات الفورية: VAPID يُولَّد تلقائياً ويُحفَظ في /data — أو fly secrets set VAPID_PUBLIC_KEY=... VAPID_PRIVATE_KEY=... EXPO_ACCESS_TOKEN=...
  # المراقبة: fly secrets set SENTRY_DSN=https://...@sentry.io/...
  THAWANI_MODE = ""              # فارغ = live في الإنتاج | uat لبيئة اختبار ثواني
  TURN_SOURCE = ""               # فارغ = تلقائي (static ← twilio ← metered) | static | metered
  TURN_TTL = "3600"              # صلاحية بيانات TURN المؤقّتة بالثواني
  VAPID_SUBJECT = ""             # mailto:… لجهة الاتصال في إشعارات الويب (افتراضياً من EMAIL_FROM)
  SENTRY_TRACES = "0"            # نسبة تتبّع الأداء 0–1
  BACKUP_ENABLED = "true"        # نسخ احتياطية تلقائية لقاعدة البيانات في /data/backups
  BACKUP_KEEP = "7"              # عدد النسخ المحتفَظ بها
  BACKUP_EVERY_HOURS = "24"      # الفاصل بالساعات
  MAIL_RECEIPTS = "true"         # إيصال بالبريد بعد الدفع (مع مزوّد بريد)
  DOMAIN = ""                    # النطاق العام إن ربطت نطاقاً خاصاً (fly certs add)
  GHCR_IMAGE = ""                # يضبطه deploy.yml تلقائياً عند النشر بالصورة الجاهزة

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[[mounts]]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
