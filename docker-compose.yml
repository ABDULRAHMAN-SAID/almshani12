# تشغيل محلي أو على أي خادم فيه Docker:  docker compose up -d   →  http://localhost:4000
services:
  manassah:
    build: .
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}   # عنوانك العام (https://…) خلف الدومين
      CORS_ORIGINS: ${CORS_ORIGINS:-}                    # فارغ = الكل؛ في الإنتاج حدّد الدومينات
      TRUST_PROXY: ${TRUST_PROXY:-}                      # true خلف وكيل عكسي أو نفق (Caddy/Nginx/Cloudflare): عنوان العميل من X-Forwarded-For بدل عنوان الوكيل، وإلا شارك الجميع حدّاً واحداً
      ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-1}             # 1 = بيانات عرض عند أول تشغيل (خادم تجريبي)
      ADMIN_PHONE: ${ADMIN_PHONE:-}                      # بديل البذر التجريبي: مدير أوّل بهذا الرقم
      # تحذير: رمز دخول ثابت يفتح كل حساب لمن يعرف الرقم — لا تفعّله على خادم يحمل بيانات حقيقية.
      # الخادم يتجاهله أصلاً في الإنتاج؛ فعّله فقط لخادم عرض مؤقّت مع ALLOW_INSECURE_OTP=1.
      # OTP_FIXED_CODE: ${OTP_FIXED_CODE:-000000}
      # رموز تحقّق حقيقية (اختيارية؛ راجع README «رموز تحقّق حقيقية») — البريد: SMTP أو Resend
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # الرسائل النصية/واتساب: Twilio Verify أو Twilio Messages أو بوابة HTTP محلية
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      SMS_HTTP_URL: ${SMS_HTTP_URL:-}
      SMS_HTTP_METHOD: ${SMS_HTTP_METHOD:-POST}
      SMS_HTTP_HEADERS: ${SMS_HTTP_HEADERS:-}
      SMS_HTTP_BODY: ${SMS_HTTP_BODY:-}
      SMS_HTTP_OK: ${SMS_HTTP_OK:-}
      # الحماية: الدول المسموحة وأهداف الاختبار
      SMS_ALLOWED_COUNTRIES: ${SMS_ALLOWED_COUNTRIES:-+968}
      OTP_TEST_TARGETS: ${OTP_TEST_TARGETS:-}
      PAYMENT_PROVIDERS: ${PAYMENT_PROVIDERS:-mock,wallet,manual}   # للإنتاج: thawani,wallet,manual
      # الدفع: ثواني (UAT للتجربة أو live من بوابة التاجر) وStripe — README «ثواني»
      THAWANI_SECRET_KEY: ${THAWANI_SECRET_KEY:-}
      THAWANI_PUBLISHABLE_KEY: ${THAWANI_PUBLISHABLE_KEY:-}
      THAWANI_WEBHOOK_SECRET: ${THAWANI_WEBHOOK_SECRET:-}
      THAWANI_MODE: ${THAWANI_MODE:-}                    # فارغ = live في الإنتاج | uat للتجربة
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # الدخول الاجتماعي (معرّفات العملاء؛ فارغ = مخفي)
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS:-}
      APPLE_SERVICES_ID: ${APPLE_SERVICES_ID:-}
      # الغرف: LiveKit للجوال، وTURN ثابت أو ديناميكي (Twilio/Metered)
      ROOM_PROVIDER: ${ROOM_PROVIDER:-internal}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      TURN_URL: ${TURN_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
      TURN_SOURCE: ${TURN_SOURCE:-}                      # فارغ = تلقائي | static | metered
      METERED_API_KEY: ${METERED_API_KEY:-}
      METERED_DOMAIN: ${METERED_DOMAIN:-}
      TURN_TTL: ${TURN_TTL:-3600}
      # الإشعارات الفورية: VAPID يُولَّد تلقائياً ويُحفَظ في /data إن تُرك فارغاً
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      # المراقبة والنسخ الاحتياطية والبريد
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES: ${SENTRY_TRACES:-0}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}            # نسخ تلقائية في /data/backups
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_EVERY_HOURS: ${BACKUP_EVERY_HOURS:-24}
      MAIL_RECEIPTS: ${MAIL_RECEIPTS:-true}              # إيصال بالبريد بعد الدفع
      # النشر (للعرض في لوحة الإدارة)
      DOMAIN: ${DOMAIN:-}
      GHCR_IMAGE: ${GHCR_IMAGE:-}
    volumes:
      - manassah-data:/data
    restart: unless-stopped
volumes:
  manassah-data:
