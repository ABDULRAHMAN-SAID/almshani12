<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title data-p>Boost to best</title>
<meta data-p name="claude:viewport-fit-sides" content="cover">
<link data-p rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;600;700&display=swap">
<style data-p>
/* Layout: one calm column (max 860px), sticky top bar, list rows; sage-mist ground, deep teal ink, warm gold for stars only */
:root{
  --bg:#EEF3F1; --surface:#FBFDFC; --soft:#E3ECE9; --line:#D3DFDB;
  --ink:#1D2C2A; --muted:#5A6D69; --accent:#2D6B65; --accent-ink:#FFFFFF; --accent-soft:#DCEBE8;
  --star:#D79A12; --star-off:#C9D6D2; --glow:#F7EDD2; --danger:#A3412F; --ok:#2E7D4F;
  --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111917; --surface:#18221F; --soft:#1F2B28; --line:#2C3A36;
  --ink:#E3ECE9; --muted:#9DB0AB; --accent:#7EC3B9; --accent-ink:#0F1A18; --accent-soft:#1F3532;
  --star:#F2BF45; --star-off:#3A4A46; --glow:#2A2715; --danger:#E6876F; --ok:#7BCB98; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111917; --surface:#18221F; --soft:#1F2B28; --line:#2C3A36;
  --ink:#E3ECE9; --muted:#9DB0AB; --accent:#7EC3B9; --accent-ink:#0F1A18; --accent-soft:#1F3532;
  --star:#F2BF45; --star-off:#3A4A46; --glow:#2A2715; --danger:#E6876F; --ok:#7BCB98; color-scheme:dark}
body{background-color:var(--bg);background-image:radial-gradient(70% 45% at 90% -5%,var(--accent-soft),transparent 70%),radial-gradient(60% 40% at -5% 105%,var(--glow),transparent 70%);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
#app{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:999px;padding:10px 20px;background:var(--accent);color:var(--accent-ink);font-weight:600;min-height:44px}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:6px 14px;min-height:36px;font-size:14px}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.input{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;min-height:44px;width:100%;box-sizing:border-box}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.muted{color:var(--muted)}
.err{color:var(--danger);font-size:14px;min-height:1.4em}
.star{width:22px;height:22px;display:block}
.star path{fill:var(--star-off)}
.on .star path,.star.on path{fill:var(--star)}

/* login */
.login{min-height:calc(100vh - 160px);display:grid;place-items:center}
.login-card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.brand-stars{display:flex;gap:6px}
.brand-stars .star{width:26px;height:26px}
.brand h1{font-size:34px;font-weight:700;color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:999px;padding:9px;min-height:40px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.hint{font-size:13px;color:var(--muted);text-align:center}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:26px;color:var(--accent)}
.top .who{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;min-height:44px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.controls .field{min-width:0}
.cls-pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;min-height:44px;font-weight:500}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.datebox{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.datebox input{border:0;background:transparent;padding:8px;min-height:38px}
.datebox button{border:0;background:var(--soft);border-radius:9px;width:38px;height:38px;display:grid;place-items:center}
.dayname{font-family:var(--display);font-size:20px;color:var(--ink)}
.daymeta{font-size:13px;color:var(--muted)}
.dayhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 12px}

.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:28px minmax(0,1.3fr) auto minmax(0,1.4fr);gap:10px 14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.num{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.who-cell{min-width:0}
.namebtn{border:0;background:none;padding:0;text-align:right;font-weight:600;color:var(--ink);font-size:15px}
.namebtn:hover{color:var(--accent);text-decoration:underline}
.total{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:3px}
.total .star{width:13px;height:13px}
.stars{display:flex;gap:2px;direction:rtl}
.stars button{border:0;background:none;padding:4px;border-radius:8px;min-width:34px;min-height:34px;display:grid;place-items:center}
.stars button:hover{background:var(--soft)}
.note{min-height:40px;padding:8px 12px;font-size:14px}
@media (max-width:640px){
  .row{grid-template-columns:24px minmax(0,1fr) auto;padding:12px}
  .row .note{grid-column:2 / -1}
  .stars button{min-width:30px;padding:2px}
}

.savebar{position:fixed;inset-inline:0;bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-top:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center}
.savebar-in{max-width:860px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.status{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dot.dirty{background:var(--star)}
.status.warn{color:var(--danger)}
#bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1}
@media (prefers-reduced-motion:no-preference){
 .stars button.just .star{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
 .mast-init{animation:glowin 1.2s ease both}
 .brand-stars .star{animation:twinkle 3.2s ease-in-out infinite}
 .brand-stars span:nth-child(2) .star,.brand-stars .star:nth-child(2){animation-delay:.5s}
 .brand-stars .star:nth-child(3){animation-delay:1s}
}
@keyframes pop{0%{transform:scale(.6) rotate(-20deg)}60%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1)}}
@keyframes twinkle{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.18) rotate(12deg);opacity:.75}}
@keyframes glowin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mast{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;margin:4px 0 22px}
.mast-school{font-family:var(--display);font-size:clamp(26px,6vw,40px);font-weight:700;color:var(--ink);line-height:1.2}
.mast-ar{font-size:15px;color:var(--muted)}
.mast-init{margin-top:10px;font-family:var(--display);font-size:clamp(20px,4.5vw,26px);font-weight:600;color:var(--accent);padding:4px 18px;border-radius:999px;background:var(--accent-soft)}
.brand .mast{margin-bottom:4px}
.top{border-top:1px solid var(--line);padding-top:12px}

.school{font-family:var(--display);font-size:17px;color:var(--ink);display:flex;flex-direction:column;align-items:center;line-height:1.4}
.school span{font-family:var(--body);font-size:12px;color:var(--muted);letter-spacing:.04em;direction:ltr}
.credit{text-align:center;font-size:13px;color:var(--muted);margin-top:28px;line-height:1.7;display:flex;flex-direction:column;align-items:center}
.credit b{font-family:var(--display);color:var(--accent);font-size:15px;font-weight:600}
.initiative{font-family:var(--display);letter-spacing:.01em}
.brand .initiative{font-size:38px}
.dnote-edit{grid-column:1 / -1;resize:vertical;font-size:14px;min-height:56px}
.day .dstars.stars button{min-width:32px;min-height:32px;padding:3px}
.status.warn .dot{background:var(--danger)}

/* history (parent + teacher drawer) */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px;margin-bottom:18px}
.hero h2{font-size:28px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--soft);border-radius:14px;padding:12px 14px}
.stat b{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.stat b .star{width:20px;height:20px}
.stat span{font-size:13px;color:var(--muted)}
.days{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.day .d1{font-weight:600}
.day .d2{font-size:13px;color:var(--muted)}
.day .dstars{display:flex;gap:2px;grid-row:1 / span 2;grid-column:2}
.day .dstars .star{width:20px;height:20px}
.day .dnote{grid-column:1 / -1;background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px;white-space:pre-wrap}
.empty{text-align:center;padding:40px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.back{border:0;background:none;color:var(--accent);padding:8px 0;min-height:44px;font-weight:500}

/* accounts */
.acc{width:100%;border-collapse:collapse;background:var(--surface);font-size:14px}
.acc th{font-weight:500;color:var(--muted);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
.acc td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.acc tr:last-child td{border-bottom:0}
.pin{font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.12em;direction:ltr;display:inline-block}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.addform{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:10px;align-items:end;margin-top:18px}
@media (max-width:640px){.addform{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}.hero h2{font-size:22px}}
.section-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.section-h h3{font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:9}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted)}
.top-start{display:flex;align-items:center;gap:10px;min-width:0}
.top{flex-wrap:nowrap}.top .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.tabs button{white-space:nowrap;flex:none}
.backbtn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:999px;padding:6px 14px 6px 12px;min-height:40px;font-weight:600}
.backbtn svg{width:18px;height:18px}
.backbtn:hover{background:var(--accent-soft)}
.login-back{align-self:flex-start}
.findbox{flex:1;min-width:170px}
.dayhead .tools{display:flex;gap:6px;margin-inline-start:auto;flex-wrap:wrap}
.btn.wa{background:transparent;color:var(--ok);border:1px solid var(--line)}
.seen-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.seen-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seen-tools .seg{display:flex;flex:none}
.seen-tools .seg button{padding:7px 14px;min-height:38px}
.srow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.sname{font-weight:600}
.sstat{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sdot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--star-off)}
.sdot.today{background:var(--ok)}.sdot.week{background:var(--star)}.sdot.never{background:var(--danger)}
.sbadge{font-size:12px;background:var(--soft);border-radius:999px;padding:1px 9px}
.lastnote{background:var(--glow);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:18px;white-space:pre-wrap}
.lastnote b{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:4px}
@media (max-width:640px){.srow{grid-template-columns:22px minmax(0,1fr)}.srow .acts{grid-column:2}.seen-sum .stat b{font-size:20px}}
@media (prefers-reduced-motion:no-preference){.row,.day{transition:background .2s}}
</style>

/* ---------- crypto ---------- */
var te=new TextEncoder(),td=new TextDecoder();
function ub(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
function bu(b){var a=new Uint8Array(b),s="";for(var i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s);}
var keyCache=new Map();
function keyFor(pw,salt){var k=pw+"#"+salt;if(!keyCache.has(k)){keyCache.set(k,crypto.subtle.importKey("raw",te.encode(pw),"PBKDF2",false,["deriveKey"]).then(function(base){return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:ub(salt),iterations:100000},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);}));}return keyCache.get(k);}
async function dec(blob,pw){var key=await keyFor(pw,blob.s);var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(blob.iv)},key,ub(blob.ct));return JSON.parse(td.decode(pt));}
async function enc(obj,pw,salt){salt=salt||bu(crypto.getRandomValues(new Uint8Array(16)));var key=await keyFor(pw,salt);var iv=crypto.getRandomValues(new Uint8Array(12));var ct=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,te.encode(JSON.stringify(obj)));return {s:salt,iv:bu(iv),ct:bu(ct)};}
async function sha(s){var h=new Uint8Array(await crypto.subtle.digest("SHA-256",te.encode(s)));return Array.from(h,function(b){return b.toString(16).padStart(2,"0");}).join("").slice(0,24);}

/* ---------- names ---------- */
function digits(s){return String(s).replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d);}).replace(/[۰-۹]/g,function(d){return "۰۱۲۳۴۵۶۷۸۹".indexOf(d);}).replace(/\s/g,"");}
function clean(s){return String(s).replace(/[ً-ْـ]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي").trim();}
function toks(s,keepSpace){var t=s.split(/\s+/).filter(function(w){return w&&w!=="بن"&&w!=="بنت"&&w!=="ابن";});var m=[];for(var i=0;i<t.length;i++){if(t[i]==="عبد"&&i+1<t.length){m.push(t[i]+(keepSpace?" ":"")+t[i+1]);i++;}else m.push(t[i]);}return m;}
function norm3(s){return toks(clean(s)).slice(0,3).join("");}
function display3(s){return toks(String(s).replace(/\s+/g," ").trim(),true).slice(0,3).join(" ");}
function lidFor(name,pin){return sha("qs|"+norm3(name)+"|"+pin);}

function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}

function matchQ(s){var q=findKey(UI.q);return !q||findKey(s.name).indexOf(q)>=0||findKey(s.short).indexOf(q)>=0;}
function relTime(iso){
  var t=new Date(iso),now=new Date(),m=Math.round((now-t)/60000);
  var hm=t.toLocaleTimeString(LOC,{hour:"numeric",minute:"2-digit"});
  if(m<1)return "الآن";if(m<60)return "منذ "+m+" دقيقة";
  var d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),d1=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  var days=Math.round((d0-d1)/86400000);
  if(days===0)return "اليوم "+hm;if(days===1)return "أمس "+hm;if(days===2)return "منذ يومين";
  if(days<11)return "منذ "+days+" أيام";return dateLong(t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate()));
}
function pingSeen(id){if(!USE_API||SEEN_SENT||!id)return;SEEN_SENT=true;try{fetch(API,{method:"POST",keepalive:true,headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({op:"seen",id:id})}).catch(function(){SEEN_SENT=false;});}catch(e){SEEN_SENT=false;}}
async function loadSeen(force){
  if(!USE_API||SEEN_LOADING||ROLE!=="teacher")return;
  if(SEEN&&!force&&Date.now()-SEEN_AT<60000)return;
  SEEN_LOADING=true;SEEN_ERR=false;if(UI.tab==="parents")rerenderKeep();
  try{
    for(var i=0;i<T.students.length;i++){var s=T.students[i],k=s.id+"|"+s.pin;if(!LIDS[k])LIDS[k]=await lidFor(s.name,s.pin);}
    var r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({op:"seen-read",pw:PW})});
    var j=await r.json();if(!j||!j.ok)throw 0;SEEN=j.seen||{};SEEN_AT=Date.now();
  }catch(e){SEEN_ERR=true;}
  SEEN_LOADING=false;if(ROLE==="teacher"&&UI.tab==="parents")rerenderKeep();
}
function seenOf(s){
  if(!SEEN)return null;var a=SEEN[s.id],b=SEEN[LIDS[s.id+"|"+s.pin]];
  if(a&&b)return {f:a.f<b.f?a.f:b.f,l:a.l>b.l?a.l:b.l,n:(a.n||0)+(b.n||0)};
  return a||b||null;
}
function seenView(){
  if(!USE_API)return '<div class="empty">متابعة الدخول تعمل في النسخة المنشورة على الموقع فقط.</div>';
  var head='<div class="section-h"><h3>دخول أولياء الأمور · '+esc(clsName(UI.cls))+'</h3><button class="btn ghost small" data-act="seenref"'+(SEEN_LOADING?" disabled":"")+'>'+(SEEN_LOADING?"جاري التحديث…":"تحديث")+'</button></div>';
  if(!SEEN){if(!SEEN_LOADING&&!SEEN_ERR)setTimeout(function(){loadSeen();},0);return head+'<div class="empty">'+(SEEN_ERR?"تعذّر جلب بيانات الدخول. تحقّقي من الإنترنت ثم اضغطي «تحديث».":"جاري جلب بيانات الدخول…")+'</div>';}
  var list=classStudents(),tday=today(),info=list.map(function(s){return {s:s,v:seenOf(s)};});
  var inN=info.filter(function(x){return x.v;}).length,todayN=info.filter(function(x){return x.v&&x.v.l.slice(0,10)===tday;}).length;
  var tdLocal=info.filter(function(x){if(!x.v)return false;var t=new Date(x.v.l);return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate())===tday;}).length;
  var sum='<div class="seen-sum"><div class="stat"><b>'+inN+' / '+list.length+'</b><span>دخلوا الصفحة</span></div><div class="stat"><b style="color:var(--danger)">'+(list.length-inN)+'</b><span>لم يدخلوا بعد</span></div><div class="stat"><b style="color:var(--ok)">'+tdLocal+'</b><span>دخلوا اليوم</span></div></div>';
  var f=UI.sf||"all";
  var seg='<div class="seg" role="group" aria-label="تصفية">'+[["all","الكل"],["never","لم يدخلوا"],["in","دخلوا"]].map(function(o){return '<button type="button" data-sf="'+o[0]+'" aria-pressed="'+(f===o[0])+'">'+o[1]+'</button>';}).join("")+'</div>';
  var tools='<div class="seen-tools">'+seg+'<input class="input findbox" id="q2" type="search" data-find="1" placeholder="بحث عن طالب" value="'+esc(UI.q||"")+'"><button class="btn ghost small" data-act="copynever">نسخ أسماء من لم يدخل</button></div>';
  info.sort(function(a,b){if(!a.v&&!b.v)return 0;if(!a.v)return -1;if(!b.v)return 1;return a.v.l<b.v.l?-1:1;});
  var shown=info.filter(function(x){return f==="all"||(f==="never"?!x.v:!!x.v);});
  var rows=shown.map(function(x,i){
    var s=x.s,v=x.v,cls,txt;
    if(!v){cls="never";txt="لم يدخل بعد";}
    else{var t=new Date(v.l),dd=(Date.now()-t)/86400000;cls=(t.toDateString()===new Date().toDateString())?"today":dd<7?"week":"";txt="آخر ظهور: "+relTime(v.l);}
    return '<li class="srow" data-name="'+esc(findKey(s.name))+'"'+(matchQ(s)?"":" hidden")+'><span class="num">'+(i+1)+'</span><div><div class="sname">'+esc(s.short)+'</div><div class="sstat"><span class="sdot '+cls+'"></span><span>'+txt+'</span>'+(v?'<span class="sbadge">'+v.n+(v.n===1?" زيارة":v.n===2?" زيارتان":v.n<=10?" زيارات":" زيارة")+'</span>':"")+'</div></div><div class="acts"><button class="btn wa small" data-wa="'+s.id+'">'+(v?"واتساب":"أرسلي الدخول بواتساب")+'</button></div></li>';
  }).join("");
  return head+sum+tools+(rows?'<ul class="list">'+rows+'</ul>':'<div class="empty">'+(f==="never"?"كل أولياء الأمور في هذا الصف دخلوا الصفحة 🎉":"لا يوجد أحد في هذه القائمة.")+'</div>')+
  '<p class="muted" style="font-size:13px;margin-top:12px">يُسجَّل الدخول ابتداءً من هذا التحديث، فمن دخل قبله يظهر «لم يدخل بعد» حتى يدخل مرة أخرى. زر واتساب يجهّز رسالة فيها الرابط واسم المستخدم والرقم السري، وتختارين المحادثة بنفسك.</p>';
}

async function doLogin(u,pw,silent){
  pw=digits(pw);
  if(UI.loginTab==="teacher"){
    var un=clean(u).replace(/\s+/g,"");
    un=un.toLowerCase().replace(/^(ا\.|أ\.|a\.|ms\.?|miss)/,"").replace(/[.'’\-_]/g,"");
    if(un&&["املالهاشمي","امل","الهاشمي","امالهاشمي","amalalhashmi","amalalhashimi","amal","المعلمه","معلمه","المعلم","معلم","teacher"].indexOf(un)<0)throw "اسم المستخدم غير صحيح";
    try{T=await dec(STATE.t,"T|"+pw);}catch(e){throw "الرقم السري غير صحيح";}
    ROLE="teacher";PW=pw;UI.cls=UI.cls||T.classes[0].id;
    ssSet({r:"t",p:pw,ui:{tab:UI.tab,cls:UI.cls,date:UI.date}});
    restoreOps();
    renderTeacher();if(dirty)schedule();markEntry();loadSeen();
  }else{
    if(!norm3(u))throw "اكتب الاسم الثلاثي للطالب";
    var id=await lidFor(u,pw);var blob=STATE.s[id];
    if(!blob)throw "الاسم أو الرقم السري غير صحيح";
    CHILD=await dec(blob,norm3(u)+"|"+pw);ROLE="parent";
    ssSet({r:"p",u:u,p:pw});
    renderParent();markEntry();pingSeen(CHILD.id||id);
  }
}

  '<form class="addform" id="addForm"><div class="field"><label for="an">إضافة طالب (الاسم الكامل)</label><input class="input" id="an" placeholder="مثال: سارة بنت خالد بن سعيد ..."></div><div class="field"><label for="ac">الصف</label><select class="input" id="ac">'+T.classes.map(function(c){return '<option value="'+c.id+'"'+(c.id===UI.cls?" selected":"")+'>'+esc(c.name)+'</option>';}).join("")+'</select></div><button class="btn" type="submit">إضافة</button></form>';
}
function credText(s){return "الطالب: "+s.short+"\nاسم المستخدم: "+s.short+"\nالرقم السري: "+s.pin;}
function renderSavebar(){
  var el=document.getElementById("savebar");if(!el)return;
  var can=canSave();
  var msg,warn=false;
  if(saving)msg="جاري الحفظ والإرسال…";
  else if(lastErr){msg=lastErr;warn=true;}
  else if(artReady&&!can){msg="الحفظ غير متاح في هذه النسخة.";warn=true;}
  else if(!artReady&&dirty)msg="جاري تجهيز الحفظ…";
  else if(dirty)msg="سيُحفظ تلقائياً خلال ثوانٍ…";
  else msg="كل التغييرات محفوظة وتظهر لأولياء الأمور";
  el.innerHTML='<div class="savebar-in"><div class="status'+(warn?" warn":"")+'"><span class="dot'+(dirty||warn?" dirty":"")+'"></span><span>'+esc(msg)+'</span></div><button class="btn" data-act="save"'+(!dirty||saving||!can?" disabled":"")+'>حفظ الآن</button></div>';
}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}}
function persistOps(inflight){lsSet("bt_ops",OPS.length?JSON.stringify({ops:OPS,inflight:inflight||null}):null);}
function opPush(op){
  if(op.t==="rec"){var i=OPS.length-1,L=OPS[i];if(L&&i>=FLUSH&&L.t==="rec"&&L.sid===op.sid&&L.date===op.date){OPS[i]=op;return;}}
  OPS.push(op);
}
function applyOp(TT,op){
  var s=TT.students.find(function(x){return x.id===op.sid;});
  if(op.t==="rec"){if(!s)return;if(op.val)s.rec[op.date]={st:op.val.st,n:op.val.n};else delete s.rec[op.date];}
  else if(op.t==="pin"){if(s)s.pin=op.pin;}
  else if(op.t==="add"){if(!s&&op.st)TT.students.push(JSON.parse(JSON.stringify(op.st)));}
  else if(op.t==="del"){TT.students=TT.students.filter(function(x){return x.id!==op.sid;});}
}
function restoreOps(){
  var saved=null;try{saved=JSON.parse(lsGet("bt_ops")||"null");}catch(e){}
  if(!saved||!saved.ops||!saved.ops.length)return;
  var ops=saved.ops;if(saved.inflight&&saved.inflight.at===STATE.at)ops=ops.slice(saved.inflight.n||0);
  OPS=ops;OPS.forEach(function(o){applyOp(T,o);});
  if(OPS.length)dirty=true;else lsSet("bt_ops",null);
}
function markDirty(){dirty=true;lastErr="";persistOps();renderSavebar();schedule();}
function setRec(s,patch,date){
  date=date||UI.date;
  var r=Object.assign({st:0,n:""},s.rec[date]||{},patch);
  if(!r.st&&!r.n.trim()){delete s.rec[date];opPush({t:"rec",sid:s.id,date:date,val:null});}
  else{s.rec[date]=r;opPush({t:"rec",sid:s.id,date:date,val:{st:r.st,n:r.n}});}
}
function rerenderKeep(){
  var ae=document.activeElement,id=ae&&ae.id,pos=null,y=window.scrollY;
  try{pos=ae&&ae.selectionStart;}catch(e){}
  renderTeacher();window.scrollTo(0,y);
  if(id){var el=document.getElementById(id);if(el){el.focus({preventScroll:true});if(pos!=null){try{el.setSelectionRange(pos,pos);}catch(e){}}}}
}
async function buildState(){
  var next={v:1,t:await enc(T,"T|"+PW,STATE.t.s),s:{},at:new Date().toISOString()};
  for(var i=0;i<T.students.length;i++){
    var s=T.students[i];var key=norm3(s.name)+"|"+s.pin;var id=await lidFor(s.name,s.pin);
    var old=STATE.s[id];
    next.s[id]=await enc({id:s.id,name:s.name,short:s.short,cls:clsName(s.cls),rec:s.rec},key,old&&old.s);
  }
  return next;
}
async function apiGet(){
  var r=await fetch(API+(API.indexOf("?")<0?"?":"&")+"t="+Date.now(),{cache:"no-store",redirect:"follow"});
  if(!r.ok)throw {code:"http_"+r.status};
  var j=await r.json();return j&&j.t&&j.s?j:null;
}
async function apiPost(body){
  var r=await fetch(API,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  if(!r.ok)throw {code:"http_"+r.status};
  return r.json();
}
async function save(){
  if(saving||!dirty||!canSave())return;
  clearTimeout(autoT);saving=true;renderSavebar();
  var sent=OPS.length;FLUSH=sent;
  try{
    var next=await buildState();
    if(USE_API){
      var res=await apiPost({pw:PW,base:STATE.at||"",state:next});
      if(res&&res.ok){
        STATE=next;OPS=OPS.slice(sent);FLUSH=0;persistOps();saving=false;dirty=OPS.length>0;lastErr="";renderSavebar();
        if(dirty)schedule();else toast("تم الحفظ");return;
      }
      if(res&&res.error==="conflict"){
        var fresh=await apiGet();
        if(fresh){STATE=fresh;var nt=await dec(STATE.t,"T|"+PW);OPS.forEach(function(o){applyOp(nt,o);});T=nt;}
        FLUSH=0;saving=false;rerenderKeep();schedule();return;
      }
      throw {code:(res&&res.error)||"server"};
    }else{
      persistOps({at:next.at,n:sent});
      var ae=document.activeElement;
      ssSet({r:"t",p:PW,ui:{tab:UI.tab,cls:UI.cls,date:UI.date,student:UI.student},y:window.scrollY,f:ae&&ae.id?ae.id:null});
      await ART.publish(buildDoc(next));
      STATE=next;OPS=OPS.slice(sent);FLUSH=0;persistOps();saving=false;dirty=OPS.length>0;renderSavebar();toast("تم الحفظ");
    }
  }catch(e){
    FLUSH=0;saving=false;persistOps();
    var c=(e&&e.code)||"network";
    lastErr=c==="bad_password"?"الرقم السري المحفوظ في الخادم لا يطابق رقم المعلمة.":
      c==="conflict"?"حُفظت نسخة أحدث من مكان آخر، جاري التحديث…":
      (c==="not_writer"||c==="not_granted"||c==="consent_required"||c==="capability_disabled")?"لا يمكن الحفظ من هذا الحساب ("+c+")":
      "تعذّر الحفظ ("+c+"). التغييرات محفوظة على هذا الجهاز وسنعيد المحاولة تلقائياً.";
    renderSavebar();
    clearTimeout(autoT);autoT=setTimeout(save,15000);
  }
}

/* ---------- events ---------- */
app.addEventListener("submit",async function(e){
  e.preventDefault();
  if(e.target.id==="loginForm"){
    var b=document.getElementById("lbtn"),er=document.getElementById("lerr");
    b.disabled=true;b.textContent="جاري التحقق…";er.textContent="";
    try{await doLogin(document.getElementById("lu").value,document.getElementById("lp").value);}
    catch(x){er.textContent=typeof x==="string"?x:"تعذّر الدخول";b.disabled=false;b.textContent="دخول";}
  }else if(e.target.id==="addForm"){
    var n=document.getElementById("an").value.replace(/\s+/g," ").trim(),c=document.getElementById("ac").value;
    if(toks(clean(n)).length<3){toast("اكتب الاسم الثلاثي على الأقل");return;}
    var dup=T.students.some(function(s){return norm3(s.name)===norm3(n);});
    if(dup){toast("يوجد طالب بنفس الاسم الثلاثي");return;}
    var ns={id:"s"+bu(crypto.getRandomValues(new Uint8Array(4))).replace(/[^a-z0-9]/gi,""),name:n,short:display3(n),cls:c,pin:newPin(),rec:{}};T.students.push(ns);opPush({t:"add",st:JSON.parse(JSON.stringify(ns))});
    UI.cls=c;markDirty();renderTeacher();toast("أُضيف الطالب");
  }
});
app.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  var d=t.dataset;
  if(d.lt){UI.loginTab=d.lt;renderLogin();return;}
  if(d.act==="logout"){doLogout();return;}
  if(d.act==="back"){goBack();return;}
  if(d.tab){if(d.tab!==UI.tab)navTo({tab:d.tab});return;}
  if(d.sf){UI.sf=d.sf;rerenderKeep();return;}
  if(d.act==="seenref"){loadSeen(true);return;}
  if(d.wa){var sw=T.students.find(function(x){return x.id===d.wa;});if(sw)openWA(waText(sw));return;}
  if(d.act==="copyday"){copy(dayReport());return;}
  if(d.act==="copynever"){var nv=classStudents().filter(function(s){return !seenOf(s);});copy(nv.length?"أولياء الأمور الذين لم يدخلوا بعد · "+clsName(UI.cls)+"\n"+nv.map(function(s,i){return (i+1)+". "+s.short;}).join("\n"):"كل أولياء الأمور دخلوا الصفحة");return;}
  if(d.cls){UI.cls=d.cls;confirmDel=null;renderTeacher();return;}
  if(d.act==="prev"||d.act==="next"){UI.date=shiftDate(UI.date,d.act==="prev"?-1:1);renderTeacher();return;}
  if(d.act==="today"){UI.date=today();renderTeacher();return;}
  if(d.act==="backday"){goBack();return;}
  if(d.act==="save"){save();return;}
  if(d.open){navTo({tab:"student",student:d.open});return;}
  if(d.star&&d.date){
    var se=T.students.find(function(x){return x.id===d.sid;});var ke=+d.star;
    var ce=(se.rec[d.date]||{}).st||0;var ne=document.getElementById("note-"+se.id+"-"+d.date);
    setRec(se,{st:ce===ke?ke-1:ke,n:ne?ne.value:""},d.date);
    var y=window.scrollY;renderTeacher();window.scrollTo(0,y);markDirty();return;
  }
  if(d.star){
    var s=T.students.find(function(x){return x.id===d.sid;});var k=+d.star;
    var cur=(s.rec[UI.date]||{}).st||0;var note=document.getElementById("note-"+s.id);
    setRec(s,{st:cur===k?k-1:k,n:note?note.value:""});
    var row=document.getElementById("row-"+s.id);var idx=classStudents().indexOf(s);
    var tmp=document.createElement("ul");tmp.innerHTML=rowHTML(s,idx);row.replaceWith(tmp.firstChild);
    var dm=document.querySelector(".daymeta");if(dm){var l=classStudents();dm.textContent=dateLong(UI.date)+" · سُجّل "+l.filter(function(x){return x.rec[UI.date];}).length+" من "+l.length+" طالباً";}
    var nb=document.querySelector('#row-'+s.id+' [data-star="'+k+'"]');if(nb){nb.focus();nb.classList.add('just');}
    markDirty();return;
  }
  if(d.copy){var s1=T.students.find(function(x){return x.id===d.copy;});copy(credText(s1));return;}
  if(d.act==="copyall"){copy(classStudents().map(credText).join("\n\n"));return;}
  if(d.repin){var s2=T.students.find(function(x){return x.id===d.repin;});s2.pin=newPin();opPush({t:"pin",sid:s2.id,pin:s2.pin});markDirty();renderTeacher();toast("رقم سري جديد لـ "+s2.short);return;}
  if(d.del){
    if(confirmDel!==d.del){confirmDel=d.del;renderTeacher();return;}
    T.students=T.students.filter(function(x){return x.id!==d.del;});opPush({t:"del",sid:d.del});confirmDel=null;markDirty();renderTeacher();toast("حُذف الطالب");return;
  }
});
app.addEventListener("input",function(e){
  if(e.target.dataset&&e.target.dataset.find){UI.q=e.target.value;[].forEach.call(document.querySelectorAll("[data-name]"),function(li){var q=findKey(UI.q);li.hidden=!!q&&li.getAttribute("data-name").indexOf(q)<0;});return;}
  var id=e.target.dataset&&e.target.dataset.note;
  if(id){var s=T.students.find(function(x){return x.id===id;});setRec(s,{n:e.target.value},e.target.dataset.date);markDirty();}
});
app.addEventListener("change",function(e){
  if(e.target.id==="dt"&&e.target.value){UI.date=e.target.value;renderTeacher();}
});
window.addEventListener("beforeunload",function(e){if(dirty&&!saving){e.preventDefault();e.returnValue="";}});


/* ---------- calm moving background ---------- */
(function(){
  var c=document.createElement("canvas");c.id="bgfx";c.setAttribute("aria-hidden","true");document.body.insertBefore(c,document.body.firstChild);
  var x=c.getContext("2d");if(!x)return;var W,H,P=[],reduce=false;
  try{reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}
  function size(){var d=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);}
  size();addEventListener("resize",size);
  var N=Math.max(14,Math.min(38,Math.round(W*H/28000)));
  for(var i=0;i<N;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:5+Math.random()*11,vy:-(0.06+Math.random()*0.22),vx:(Math.random()-.5)*0.12,a:Math.random()*6.28,va:(Math.random()-.5)*0.004,s:Math.random()<.6,o:.10+Math.random()*.18,ph:Math.random()*6.28});
  var cs="#D79A12",ca="#2D6B65",fr=0;
  function cols(){var st=getComputedStyle(document.documentElement);cs=st.getPropertyValue("--star").trim()||cs;ca=st.getPropertyValue("--accent").trim()||ca;}
  function star(r){x.beginPath();for(var k=0;k<10;k++){var rr=k%2?r*.45:r,an=k*Math.PI/5-Math.PI/2;x.lineTo(Math.cos(an)*rr,Math.sin(an)*rr);}x.closePath();}
  function frame(t){
    if(fr++%120===0)cols();
    x.clearRect(0,0,W,H);
    for(var i=0;i<P.length;i++){var p=P[i];
      if(!reduce){p.x+=p.vx;p.y+=p.vy;p.a+=p.va;if(p.y<-24){p.y=H+24;p.x=Math.random()*W;}if(p.x<-24)p.x=W+24;if(p.x>W+24)p.x=-24;}
      x.save();x.translate(p.x,p.y);x.rotate(p.a);x.globalAlpha=p.o*(reduce?1:(.7+.3*Math.sin(t/900+p.ph)));x.fillStyle=p.s?cs:ca;
      if(p.s)star(p.r);else{x.beginPath();x.arc(0,0,p.r*.32,0,6.3);}
      x.fill();x.restore();}
    if(!reduce)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* ---------- boot ---------- */
(async function(){
  if(USE_API){
    app.innerHTML='<div class="loading">جاري تحميل آخر البيانات…</div>';
    try{var fresh=await apiGet();if(fresh)STATE=fresh;}
    catch(e){setTimeout(function(){toast("تعذّر الاتصال بالإنترنت، قد لا تظهر آخر التحديثات");},400);}
  }
  if(USE_API){document.addEventListener("visibilitychange",async function(){
    if(document.hidden||ROLE!=="parent")return;var s2=ssGet();if(!s2||s2.r!=="p")return;
    try{var f=await apiGet();if(f&&f.at!==STATE.at){STATE=f;await doLogin(s2.u,s2.p);}}catch(e){}
  });}
  var ss=ssGet();
  if(ss&&ss.r==="t"){UI.loginTab="teacher";if(ss.ui){UI.tab=ss.ui.tab||"day";UI.cls=ss.ui.cls;UI.date=ss.ui.date||today();UI.student=ss.ui.student||null;}
    try{
      await doLogin("",ss.p);
      if(ss.y)window.scrollTo(0,ss.y);
      if(ss.f){var fe=document.getElementById(ss.f);if(fe){fe.focus({preventScroll:true});if(fe.setSelectionRange&&fe.value!=null){try{fe.setSelectionRange(fe.value.length,fe.value.length);}catch(e){}}}}
      return;
    }catch(e){ssSet(null);}}
  if(ss&&ss.r==="p"){UI.loginTab="parent";try{await doLogin(ss.u,ss.p);return;}catch(e){ssSet(null);}}
  renderLogin();
})();
})();
