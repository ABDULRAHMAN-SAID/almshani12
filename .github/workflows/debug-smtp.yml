# تشخيص مؤقّت: يتحقّق هل بيانات SMTP_USER/SMTP_PASS تنجح فعلاً في الاتصال بـ Gmail من شبكة GitHub —
# بلا طباعة السرّ أبداً، فقط نجاح/فشل ورمز الخطأ. يُشغَّل يدوياً فقط، ويُحذَف بعد التشخيص.
name: debug-smtp
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install nodemailer@6
      - name: هل SMTP_USER/SMTP_PASS موجودان أصلاً؟
        run: |
          if [ -z "$SMTP_USER" ]; then echo "::error::السرّ SMTP_USER غير مضبوط إطلاقاً"; exit 1; fi
          if [ -z "$SMTP_PASS" ]; then echo "::error::السرّ SMTP_PASS غير مضبوط إطلاقاً"; exit 1; fi
          echo "كلاهما مضبوطان. SMTP_USER طوله ${#SMTP_USER} حرفاً، SMTP_PASS طوله ${#SMTP_PASS} حرفاً."
      - name: اختبار اتصال SMTP فعلي بـ Gmail
        run: |
          node -e "
          const nodemailer = require('nodemailer');
          const t = nodemailer.createTransport({
            host: 'smtp.gmail.com', port: 587, secure: false,
            auth: { user: process.env.SMTP_USER, pass: process.env.SMTP_PASS },
            connectionTimeout: 15000, greetingTimeout: 15000, socketTimeout: 15000,
          });
          t.verify().then(() => { console.log('✅ SMTP_OK — الاتصال والتحقّق نجحا'); }).catch(e => {
            console.log('❌ SMTP_FAILED code=' + (e.code||'') + ' responseCode=' + (e.responseCode||'') + ' message=' + String(e.message||e).slice(0,300));
            process.exit(1);
          });
          "
