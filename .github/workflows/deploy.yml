# النشر: يبني صورة Docker ويدفعها إلى GitHub Container Registry (ghcr.io) عند كل دفعة إلى main أو يدوياً،
# ثم ينشر اختيارياً إلى Fly.io (إن وُجد السرّ FLY_API_TOKEN) أو Render (إن وُجد السرّ RENDER_DEPLOY_HOOK_URL).
# بلا أسرار: تُبنى الصورة فقط ويُطبع سبب تخطّي كل نشر. الصورة: ghcr.io/<owner>/<repo>:latest و:<sha>
name: deploy
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
  packages: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  image:
    name: بناء الصورة ودفعها إلى GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: اسم الصورة (أحرف صغيرة كما يشترط GHCR)
        id: meta
        run: |
          IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "الصورة: $IMAGE"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: الملخّص
        run: |
          {
            echo "## 📦 الصورة جاهزة"
            echo
            echo '```'
            echo "docker pull ${{ steps.meta.outputs.image }}:latest"
            echo '```'
            echo "على الخادم: \`docker tag ${{ steps.meta.outputs.image }}:latest manassah:latest\` ثم \`DOMAIN=app.example.om docker compose -f deploy/docker-compose.prod.yml up -d\` — راجع deploy/README.md"
          } >> "$GITHUB_STEP_SUMMARY"

  fly:
    name: النشر إلى Fly.io (اختياري)
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: هل السرّ FLY_API_TOKEN موجود؟
        id: gate
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "⏭️ تخطّي Fly: السرّ FLY_API_TOKEN غير مضبوط (Settings ← Secrets ← Actions). fly.toml جاهز — أنشئ التطبيق بـ fly launch ثم أضف السرّ."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.gate.outputs.run == 'true'
      - name: fly deploy بالصورة المبنية
        if: steps.gate.outputs.run == 'true'
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          SHA: ${{ github.sha }}
        run: |
          # صورة GHCR لمستودع خاص تكون خاصة أيضاً ولا يستطيع Fly سحبها — نسحبها هنا بـ GITHUB_TOKEN ونعيد دفعها إلى سجلّ Fly ثم ننشر منها
          APP="$(sed -nE 's/^app *= *"?([^"]+)"?/\1/p' fly.toml | head -n1)"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE:$SHA"
          docker tag "$IMAGE:$SHA" "registry.fly.io/$APP:$SHA"
          flyctl auth docker
          docker push "registry.fly.io/$APP:$SHA"
          flyctl deploy --image "registry.fly.io/$APP:$SHA" --env GHCR_IMAGE="$IMAGE"
          echo "🚀 نُشر إلى Fly.io ($APP) من الصورة $IMAGE:$SHA" >> "$GITHUB_STEP_SUMMARY"

  render:
    name: النشر إلى Render (اختياري)
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: استدعاء Deploy Hook
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "⏭️ تخطّي Render: السرّ RENDER_DEPLOY_HOOK_URL غير مضبوط (Render ← الخدمة ← Settings ← Deploy Hook ← انسخ الرابط إلى أسرار المستودع)."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null && echo "🚀 طُلب النشر من Render (يبني من render.yaml)" | tee -a "$GITHUB_STEP_SUMMARY"
