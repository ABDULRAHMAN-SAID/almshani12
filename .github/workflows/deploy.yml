# النشر: يبني صورة Docker ويدفعها إلى GitHub Container Registry (ghcr.io) عند كل دفعة إلى main أو يدوياً،
# ثم ينشر اختيارياً إلى Fly.io (إن وُجد السرّ FLY_API_TOKEN) أو Render (إن وُجد السرّ RENDER_DEPLOY_HOOK_URL).
# بلا أسرار: تُبنى الصورة فقط ويُطبع سبب تخطّي كل نشر. الصورة: ghcr.io/<owner>/<repo>:latest و:<sha>
name: deploy
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
  packages: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  image:
    name: بناء الصورة ودفعها إلى GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: اسم الصورة (أحرف صغيرة كما يشترط GHCR)
        id: meta
        run: |
          IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "الصورة: $IMAGE"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: الملخّص
        run: |
          {
            echo "## 📦 الصورة جاهزة"
            echo
            echo '```'
            echo "docker pull ${{ steps.meta.outputs.image }}:latest"
            echo '```'
            echo "على الخادم: \`docker tag ${{ steps.meta.outputs.image }}:latest manassah:latest\` ثم \`DOMAIN=app.example.om docker compose -f deploy/docker-compose.prod.yml up -d\` — راجع deploy/README.md"
          } >> "$GITHUB_STEP_SUMMARY"

  fly:
    name: النشر إلى Fly.io (اختياري)
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      ADMIN_PHONE: ${{ secrets.ADMIN_PHONE }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
    steps:
      - name: هل السرّ FLY_API_TOKEN موجود؟
        id: gate
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "⏭️ تخطّي Fly: السرّ FLY_API_TOKEN غير مضبوط (Settings ← Secrets ← Actions). fly.toml جاهز — أنشئ التطبيق بـ fly launch ثم أضف السرّ."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.gate.outputs.run == 'true'
      - name: التطبيق ومساحة التخزين الدائمة (تُنشأ مرة واحدة إن لم توجدا)
        if: steps.gate.outputs.run == 'true'
        run: |
          # يعمل على خادم GitHub لا في بيئة المطوّر المحدودة الشبكة — يبلغ api.fly.io مباشرة
          APP="$(sed -nE 's/^app *= *"?([^"]+)"?/\1/p' fly.toml | head -n1)"
          REGION="$(sed -nE 's/^primary_region *= *"?([^"]+)"?/\1/p' fly.toml | head -n1)"
          echo "APP=$APP" >> "$GITHUB_ENV"
          # render.JSON في flyctl يُخرج JSON منسّقاً (مسافات وأسطر) لا مضغوطاً — jq لا grep نصّي هشّ
          if flyctl apps list --json 2>/dev/null | jq -e --arg n "$APP" 'any(.[]; .Name == $n)' > /dev/null; then
            echo "✔️ التطبيق $APP موجود مسبقاً"
          else
            echo "↻ إنشاء التطبيق $APP في $REGION"
            flyctl apps create "$APP" --org personal || { echo "::error::تعذّر إنشاء $APP — الاسم قد يكون محجوزاً لحساب آخر على Fly؛ غيّر app في fly.toml إلى اسم آخر (مثل ${APP}-$(date +%s | tail -c4)) وأعد الدفع"; exit 1; }
          fi
          if flyctl volumes list --app "$APP" --json 2>/dev/null | jq -e 'any(.[]; .name == "data")' > /dev/null; then
            echo "✔️ مساحة التخزين data موجودة مسبقاً"
          else
            echo "↻ إنشاء مساحة تخزين دائمة (data، ١ جيجابايت، $REGION) — هنا تُحفَظ القاعدة والملفات والنسخ الاحتياطية بلا مسحٍ عند كل نشر"
            flyctl volumes create data --app "$APP" --region "$REGION" --size 1 --yes
          fi
      - name: fly deploy بالصورة المبنية
        if: steps.gate.outputs.run == 'true'
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          SHA: ${{ github.sha }}
        run: |
          # صورة GHCR لمستودع خاص تكون خاصة أيضاً ولا يستطيع Fly سحبها — نسحبها هنا بـ GITHUB_TOKEN ونعيد دفعها إلى سجلّ Fly ثم ننشر منها
          APP="$(sed -nE 's/^app *= *"?([^"]+)"?/\1/p' fly.toml | head -n1)"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE:$SHA"
          docker tag "$IMAGE:$SHA" "registry.fly.io/$APP:$SHA"
          flyctl auth docker
          docker push "registry.fly.io/$APP:$SHA"
          # كل هذه أسرار اختيارية تُمرَّر فقط إن كانت مضبوطة — بلا بريد حقيقي يبقى الخادم يعمل، لكن لا أحد يستقبل رمز تحقّق
          flyctl deploy --image "registry.fly.io/$APP:$SHA" --env GHCR_IMAGE="$IMAGE" \
            ${ADMIN_PHONE:+--env ADMIN_PHONE="$ADMIN_PHONE"} \
            ${SMTP_HOST:+--env SMTP_HOST="$SMTP_HOST"} \
            ${SMTP_PORT:+--env SMTP_PORT="$SMTP_PORT"} \
            ${SMTP_USER:+--env SMTP_USER="$SMTP_USER" --env EMAIL_FROM="$SMTP_USER"} \
            ${SMTP_PASS:+--env SMTP_PASS="$SMTP_PASS"}
          echo "🚀 نُشر إلى Fly.io ($APP) من الصورة $IMAGE:$SHA" >> "$GITHUB_STEP_SUMMARY"

  render:
    name: النشر إلى Render (اختياري)
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: استدعاء Deploy Hook
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "⏭️ تخطّي Render: السرّ RENDER_DEPLOY_HOOK_URL غير مضبوط (Render ← الخدمة ← Settings ← Deploy Hook ← انسخ الرابط إلى أسرار المستودع)."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null && echo "🚀 طُلب النشر من Render (يبني من render.yaml)" | tee -a "$GITHUB_STEP_SUMMARY"
